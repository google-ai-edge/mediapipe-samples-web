name: Comprehensive Release Validation

on:
  workflow_dispatch:
    inputs:
      gcs_path:
        description: >-
          Optional GCS directory URI containing staged .tgz npm release tarballs
          (e.g. gs://mediapipe-assets/sdk_validation_staging/web/<candidate_name>).
          Leave blank to validate the repository's current dependencies.
        required: false
        default: ''
        type: string
      task_filter:
        description: >-
          Optional comma-separated task or domain filter (e.g. "vision", "audio/text_to_speech").
          Leave blank to validate all 22 tasks.
        required: false
        default: ''
        type: string
      include_large_models:
        description: >-
          Download and test large models (ASR, TTS, EmbeddingGemma-2, Decision Maker, Retrieval).
        required: false
        default: true
        type: boolean
      fail_on_fallback:
        description: >-
          Fail the run if a GPU delegate request falls back to CPU.
        required: false
        default: false
        type: boolean
  pull_request:
    branches: ["main"]
    paths:
      - '.github/workflows/release_validation.yml'
      - '.github/scripts/release_validate/**'

permissions:
  contents: read
  checks: write
  id-token: write

concurrency:
  group: "${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('dispatch-{0}', github.run_id) }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-all:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize workspace paths and settings
        env:
          BASE_TEMP: ${{ runner.temp }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TASK_FILTER: ${{ inputs.task_filter }}
          INPUT_INCLUDE_LARGE: ${{ inputs.include_large_models }}
          INPUT_FAIL_ON_FALLBACK: ${{ inputs.fail_on_fallback }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_SHA: ${{ github.sha }}
        run: |
          STAGED_NPM_DIR="${BASE_TEMP}/staged-npm-${RUN_ID}-${RUN_ATTEMPT}"
          REPORT_DIR="${GITHUB_WORKSPACE}/release-validation-report"
          CHROME_PROFILE_DIR="${BASE_TEMP}/chrome-profile-${RUN_ID}-${RUN_ATTEMPT}"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            TASK_FILTER="vision/object_detector,text/text_classifier,audio/audio_classifier"
            INCLUDE_LARGE_MODELS="false"
            FAIL_ON_FALLBACK="false"
            RELEASE_HEAD_SHA="${PR_HEAD_SHA}"
          else
            TASK_FILTER="${INPUT_TASK_FILTER}"
            INCLUDE_LARGE_MODELS="${INPUT_INCLUDE_LARGE:-true}"
            FAIL_ON_FALLBACK="${INPUT_FAIL_ON_FALLBACK:-false}"
            RELEASE_HEAD_SHA="${DEFAULT_SHA}"
          fi
          {
            echo "STAGED_NPM_DIR=${STAGED_NPM_DIR}"
            echo "REPORT_DIR=${REPORT_DIR}"
            echo "CHROME_PROFILE_DIR=${CHROME_PROFILE_DIR}"
            echo "TASK_FILTER=${TASK_FILTER}"
            echo "INCLUDE_LARGE_MODELS=${INCLUDE_LARGE_MODELS}"
            echo "FAIL_ON_FALLBACK=${FAIL_ON_FALLBACK}"
            echo "RELEASE_HEAD_SHA=${RELEASE_HEAD_SHA}"
          } >> "${GITHUB_ENV}"
          mkdir -p "${REPORT_DIR}/screenshots" "${CHROME_PROFILE_DIR}"

      - name: Validate optional GCS path input
        if: github.event_name == 'workflow_dispatch' && inputs.gcs_path != ''
        env:
          GCS_PATH: ${{ inputs.gcs_path }}
        run: node .github/scripts/release_validate/tarballs.mjs validate-gcs-path

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Run release validation script self-tests
        run: |
          set -euo pipefail
          node .github/scripts/release_validate/tarballs.mjs self-test
          node .github/scripts/release_validate/runner.mjs self-test

      - name: Check optional GCP authentication configuration
        id: gcp-auth-check
        if: github.event_name == 'workflow_dispatch' && inputs.gcs_path != ''
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_CREDS: ${{ secrets.GCP_CREDENTIALS || secrets.GCP_SA_KEY }}
        run: |
          if [[ -n "${WIF_PROVIDER}" ]]; then
            echo "auth_mode=wif" >> "${GITHUB_OUTPUT}"
          elif [[ -n "${GCP_CREDS}" ]]; then
            echo "auth_mode=credentials_json" >> "${GITHUB_OUTPUT}"
          else
            echo "auth_mode=public" >> "${GITHUB_OUTPUT}"
          fi

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth-wif
        if: github.event_name == 'workflow_dispatch' && inputs.gcs_path != '' && steps.gcp-auth-check.outputs.auth_mode == 'wif'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT || secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Authenticate to Google Cloud (Service Account Key)
        id: auth-sa
        if: github.event_name == 'workflow_dispatch' && inputs.gcs_path != '' && steps.gcp-auth-check.outputs.auth_mode == 'credentials_json'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS || secrets.GCP_SA_KEY }}
          token_format: access_token

      - name: Download staged NPM tarballs from GCS
        if: github.event_name == 'workflow_dispatch' && inputs.gcs_path != ''
        env:
          GCS_PATH: ${{ inputs.gcs_path }}
          GCP_ACCESS_TOKEN: ${{ steps.auth-wif.outputs.access_token || steps.auth-sa.outputs.access_token }}
        run: node .github/scripts/release_validate/tarballs.mjs download-tarballs --out-dir "${STAGED_NPM_DIR}"

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Override @mediapipe/tasks-* packages with staged tarballs
        if: github.event_name == 'workflow_dispatch' && inputs.gcs_path != ''
        run: |
          set -euo pipefail
          node .github/scripts/release_validate/tarballs.mjs apply-overrides --staged-dir "${STAGED_NPM_DIR}"
          pnpm install --no-frozen-lockfile
          pnpm prune
          node .github/scripts/release_validate/tarballs.mjs verify-installed --staged-dir "${STAGED_NPM_DIR}"

      - name: Build sample web app and verify WASM assets
        id: build
        run: |
          set -euo pipefail
          rm -rf public/wasm dist
          node copy-wasm.js
          node .github/scripts/release_validate/tarballs.mjs verify-wasm
          pnpm run build
          node .github/scripts/release_validate/tarballs.mjs verify-wasm --check-dist

      - name: Install Google Chrome, Xvfb, and Vulkan software driver
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          pnpm exec playwright install chrome --with-deps
          sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers libvulkan1 || true
          df -h

      - name: Initialize live progress tracker and Chrome probe
        if: steps.build.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          xvfb-run -a node .github/scripts/release_validate/runner.mjs init \
            --report-dir "${REPORT_DIR}" \
            --user-data-dir "${CHROME_PROFILE_DIR}"

      - name: Validate Vision tasks (all models, modes, delegates)
        if: "!cancelled() && steps.build.outcome == 'success'"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          xvfb-run -a node .github/scripts/release_validate/runner.mjs run-domain \
            --domain vision \
            --report-dir "${REPORT_DIR}" \
            --user-data-dir "${CHROME_PROFILE_DIR}" \
            --port 4174

      - name: Validate Text tasks (all models, modes, delegates)
        if: "!cancelled() && steps.build.outcome == 'success'"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          xvfb-run -a node .github/scripts/release_validate/runner.mjs run-domain \
            --domain text \
            --report-dir "${REPORT_DIR}" \
            --user-data-dir "${CHROME_PROFILE_DIR}" \
            --port 4174

      - name: Validate Retrieval tasks (all models, modes, delegates)
        if: "!cancelled() && steps.build.outcome == 'success'"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          xvfb-run -a node .github/scripts/release_validate/runner.mjs run-domain \
            --domain retrieval \
            --report-dir "${REPORT_DIR}" \
            --user-data-dir "${CHROME_PROFILE_DIR}" \
            --port 4174

      - name: Validate Decision tasks (all models, modes, delegates)
        if: "!cancelled() && steps.build.outcome == 'success'"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          xvfb-run -a node .github/scripts/release_validate/runner.mjs run-domain \
            --domain decision \
            --report-dir "${REPORT_DIR}" \
            --user-data-dir "${CHROME_PROFILE_DIR}" \
            --port 4174

      - name: Validate Audio tasks (all models, modes, delegates)
        if: "!cancelled() && steps.build.outcome == 'success'"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          xvfb-run -a node .github/scripts/release_validate/runner.mjs run-domain \
            --domain audio \
            --report-dir "${REPORT_DIR}" \
            --user-data-dir "${CHROME_PROFILE_DIR}" \
            --port 4174

      - name: Publish consolidated release validation report
        if: "!cancelled() && steps.build.outcome == 'success'"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node .github/scripts/release_validate/runner.mjs finalize \
            --report-dir "${REPORT_DIR}"

      - name: Upload release validation report and screenshots
        if: "!cancelled()"
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-validation-report
          if-no-files-found: ignore
          retention-days: 30

      - name: Clean up temp directories
        if: always()
        run: |
          rm -rf "${STAGED_NPM_DIR:-}" "${CHROME_PROFILE_DIR:-}"

<div class="dt-root">
  <div id="dt-kind-toggle"></div>
  <p id="dt-kind-help" class="dt-kind-help"></p>

  <div id="dt-form-card" class="dt-card">
    <div class="dt-input-header">
      <label class="dt-label" for="dt-input">Input text <span class="dt-hint">what the model reads</span></label>
      <div id="dt-samples" class="dt-samples"></div>
    </div>
    <textarea id="dt-input" class="dt-field" rows="3"></textarea>

    <div id="dt-boolean-fields">
      <label class="dt-label" for="dt-condition">
        Condition <span class="dt-hint">a statement the model checks against the input text</span>
      </label>
      <textarea id="dt-condition" class="dt-field" rows="2"></textarea>

      <div class="dt-two-col">
        <div>
          <label class="dt-label" for="dt-true-desc"
            >Yes means <span class="dt-hint">optional · what a Yes looks like</span></label
          >
          <textarea id="dt-true-desc" class="dt-field" rows="2"></textarea>
        </div>
        <div>
          <label class="dt-label" for="dt-false-desc"
            >No means <span class="dt-hint">optional · what a No looks like</span></label
          >
          <textarea id="dt-false-desc" class="dt-field" rows="2"></textarea>
        </div>
      </div>

      <label class="dt-label" for="dt-threshold">
        Threshold <span class="dt-hint">answer Yes when P(yes) ≥ <b id="dt-threshold-value">0.50</b></span>
      </label>
      <input id="dt-threshold" type="range" min="0.05" max="0.95" step="0.05" value="0.5" class="range-slider" />
    </div>

    <div id="dt-list-fields">
      <label class="dt-label" for="dt-instructions"
        >Instructions <span class="dt-hint">the question to answer</span></label
      >
      <input id="dt-instructions" class="dt-field" type="text" />
      <div class="dt-label">
        <span id="dt-items-title">Options</span> <span id="dt-items-hint" class="dt-hint"></span>
      </div>
      <div id="dt-items"></div>
      <button id="dt-add-item" class="dt-link-btn">
        <span class="material-icons">add</span><span id="dt-add-label">Add option</span>
      </button>
    </div>

    <label class="dt-label" for="dt-context"
      >Context <span class="dt-hint">optional · background that helps the model</span></label
    >
    <input id="dt-context" class="dt-field" type="text" placeholder="e.g. Screening emails sent to a company inbox." />

    <div class="dt-actions">
      <div class="dt-actions-left">
        <button id="dt-reset" class="dt-link-btn">Restore sample</button>
        <button id="dt-open-json" class="dt-link-btn" title="Open this question in the JSON tab">
          <span class="material-icons">data_object</span>Edit as JSON
        </button>
      </div>
      <button id="dt-evaluate" class="dt-action-btn" disabled>
        <span class="material-icons">psychology</span> Evaluate
      </button>
    </div>
  </div>

  <div id="dt-combined-card" class="dt-card" style="display: none">
    <label class="dt-label" for="dt-c-input">Input text <span class="dt-hint">what the model reads</span></label>
    <textarea id="dt-c-input" class="dt-field" rows="3"></textarea>

    <label class="dt-label" for="dt-c-context"
      >Schema context <span class="dt-hint">optional · prepended to every question</span></label
    >
    <input id="dt-c-context" class="dt-field" type="text" />

    <div class="dt-label">Questions <span class="dt-hint">evaluated together on the same input</span></div>
    <div id="dt-c-questions"></div>
    <button id="dt-c-add-question" class="dt-link-btn"><span class="material-icons">add</span>Add question</button>

    <div class="dt-actions">
      <div class="dt-actions-left">
        <button id="dt-c-reset" class="dt-link-btn">Restore sample</button>
        <button id="dt-c-open-json" class="dt-link-btn" title="Open this schema in the JSON tab">
          <span class="material-icons">data_object</span>Edit as JSON
        </button>
      </div>
      <button id="dt-c-evaluate" class="dt-action-btn" disabled>
        <span class="material-icons">psychology</span> Evaluate
      </button>
    </div>
  </div>

  <div id="dt-json-card" class="dt-card" style="display: none">
    <p class="dt-json-help">
      Paste a Decision API request: one question, as passed to <code>evaluateBoolean</code> /
      <code>evaluateChoice</code> / <code>evaluateScore</code>, or a <code>ClassifierSchema</code> whose
      <code>questions</code> are all evaluated together with <code>evaluate(input, schema)</code>.
    </p>
    <textarea
      id="dt-json-text"
      class="dt-field dt-json-text"
      spellcheck="false"
      placeholder='{ "input": "...", "context": "...", "questions": [{ "id": "...", "type": "binary", "prompt": "..." }] }'
    ></textarea>
    <div id="dt-json-error" class="dt-json-error"></div>
    <div class="dt-actions">
      <div class="dt-actions-left">
        <button id="dt-json-example" class="dt-link-btn">
          <span class="material-icons">auto_fix_high</span>Insert example
        </button>
        <button id="dt-json-clear" class="dt-link-btn">Clear</button>
        <button id="dt-json-to-form" class="dt-link-btn" title="Open a schema in Combined, or one question in its tab">
          <span class="material-icons">edit_note</span>Load into form
        </button>
      </div>
      <button id="dt-json-evaluate" class="dt-action-btn" disabled>
        <span class="material-icons">psychology</span> Evaluate
      </button>
    </div>
  </div>

  <div class="dt-card">
    <div class="dt-label">Result</div>
    <div id="dt-results"></div>
  </div>

  <style>
    .dt-root {
      width: 100%;
      max-width: 800px;
    }
    .dt-card {
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 16px;
      margin-bottom: 12px;
      background: var(--surface);
    }
    .dt-label {
      display: block;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
      color: var(--text-secondary);
      margin: 12px 0 6px;
    }
    .dt-input-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .dt-input-header .dt-label {
      margin: 0;
    }
    .dt-samples {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .dt-sample {
      border: 1px solid var(--border-color);
      background: transparent;
      border-radius: 16px;
      padding: 4px 12px;
      font-size: 0.75rem;
      color: var(--text-secondary);
      cursor: pointer;
    }
    .dt-sample:hover {
      color: var(--primary);
      border-color: var(--primary);
    }
    .dt-sample.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .dt-hint {
      text-transform: none;
      letter-spacing: 0;
      font-weight: 400;
      margin-left: 4px;
    }
    .dt-kind-help {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin: 8px 2px 12px;
      line-height: 1.4;
    }
    .dt-two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 600px) {
      .dt-two-col {
        grid-template-columns: 1fr;
      }
    }
    .dt-field {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-main);
      font-family: 'Roboto', sans-serif;
      font-size: 0.9rem;
      resize: vertical;
    }
    .dt-field:focus {
      outline: none;
      border-color: var(--primary);
    }
    .dt-item {
      display: grid;
      grid-template-columns: 30% 1fr 32px;
      gap: 8px;
      margin-bottom: 8px;
    }
    .dt-icon-btn {
      border: none;
      background: none;
      cursor: pointer;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }
    .dt-icon-btn:hover {
      background: #f1f3f4;
      color: var(--text-main);
    }
    .dt-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: none;
      background: none;
      color: var(--primary);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      padding: 4px 0;
    }
    .dt-link-btn .material-icons {
      font-size: 18px;
    }
    .dt-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
    }
    .dt-action-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      padding: 10px 24px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
    }
    .dt-action-btn .material-icons {
      font-size: 18px;
    }
    .dt-action-btn:hover:not(:disabled) {
      background: var(--primary-hover);
    }
    .dt-action-btn:disabled {
      background: var(--border-color);
      cursor: not-allowed;
    }
    .dt-q {
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 12px;
      margin-bottom: 10px;
    }
    .dt-q-head {
      display: grid;
      grid-template-columns: auto 1fr 190px 32px;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .dt-q-badge {
      font-family: 'Roboto Mono', monospace;
      font-size: 0.7rem;
      color: var(--primary);
      background: rgba(26, 115, 232, 0.08);
      border-radius: 4px;
      padding: 3px 6px;
      white-space: nowrap;
    }
    .dt-q-threshold {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 8px;
    }
    .dt-q-threshold input {
      flex: 1;
    }
    .dt-q .dt-item {
      margin-top: 8px;
      margin-bottom: 0;
    }
    @media (max-width: 600px) {
      .dt-q-head {
        grid-template-columns: 1fr 32px;
      }
    }
    .dt-result + .dt-result {
      border-top: 1px solid var(--border-color);
      margin-top: 12px;
      padding-top: 12px;
    }
    .dt-result-title {
      font-family: 'Roboto Mono', monospace;
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 2px;
    }
    .dt-headline {
      font-size: 1.6rem;
      font-weight: 500;
      color: var(--text-main);
    }
    .dt-muted {
      color: var(--text-secondary);
    }
    .dt-subtitle {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin: 2px 0 8px;
      min-height: 1em;
    }
    .dt-bar {
      display: grid;
      grid-template-columns: 35% 1fr 56px;
      align-items: center;
      gap: 12px;
      padding: 4px 0;
    }
    .dt-bar-label {
      font-size: 0.85rem;
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .dt-bar.hl .dt-bar-label {
      font-weight: 600;
    }
    .dt-bar-track {
      height: 8px;
      background: #f1f3f4;
      border-radius: 4px;
      overflow: hidden;
    }
    .dt-bar-fill {
      height: 100%;
      background: #bdc1c6;
      border-radius: 4px;
      transition: width 0.3s;
    }
    .dt-bar.hl .dt-bar-fill {
      background: var(--primary);
    }
    .dt-bar-value {
      font-family: 'Roboto Mono', monospace;
      font-size: 0.8rem;
      text-align: right;
      color: var(--text-main);
    }
    .dt-actions-left {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .dt-json-help {
      font-size: 0.85rem;
      color: var(--text-secondary, #5f6368);
      margin: 0 0 12px;
      line-height: 1.4;
    }
    .dt-json-help code {
      font-family: 'Roboto Mono', monospace;
      font-size: 0.8rem;
    }
    .dt-json-text {
      width: 100%;
      box-sizing: border-box;
      min-height: 320px;
      font-family: 'Roboto Mono', monospace;
      font-size: 0.8rem;
      white-space: pre;
    }
    .dt-json-error {
      color: #d93025;
      font-size: 0.85rem;
      min-height: 1.2em;
      margin: 8px 0;
    }
  </style>
</div>
